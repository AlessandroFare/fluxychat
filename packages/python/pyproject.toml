[project]
name = "fluxychat"
version = "0.1.0"
description = "Join a FluxyChat room, stream tokens, tool events. Thin HTTP/WS client."
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

