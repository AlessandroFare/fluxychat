# Security scanning pipeline for fluxychat
# Enables GitLab's built-in security scanners so the Vulnerability Report
# is populated on the default branch and on merge requests.
#
# Docs:
# - SAST:                https://docs.gitlab.com/ee/user/application_security/sast/
# - Dependency Scanning: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/
# - Secret Detection:    https://docs.gitlab.com/ee/user/application_security/secret_detection/

stages:
  - test

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Run security scans on merge requests and on the default branch.
# This keeps the Vulnerability Report up to date for triage.
variables:
  SECURE_LOG_LEVEL: "info"
  # Scan the full history once so existing committed secrets are surfaced.
  SECRET_DETECTION_HISTORIC_SCAN: "false"

sast:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dependency_scanning:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

secret_detection:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
