  - id: b-utf8-truncation
    title: 'B-4 Unicode-safe truncation â€” verify and extend'
    assigned_to: coder
    verified_by: verifier
    timeout_ms: 1500000
    prompt: |
      GOAL: Confirm `truncateForStorage` in
      `apps/worker/src/lib/storage-utils.js` is byte-safe at 4000 bytes
      for arbitrary UTF-8 (the brief says "4000 bytes", current default
      is 500 chars). Extend the existing function or add a
      `truncateForStorageBytes` variant that operates on bytes.

      CURRENT STATE: The existing function is UTF-16 surrogate-safe
      (walks back to a valid pair boundary) but measures in UTF-16
      code units, not UTF-8 bytes. The brief explicitly wants byte-safe
      truncation at 4000 bytes.

      WHAT TO DO:
      1. Read `apps/worker/src/lib/storage-utils.js`. The current
         function at line 14 handles 4-byte emoji correctly because
         JS strings are UTF-16 and emojis are surrogate pairs.
      2. If the brief is asking for *byte*-safe truncation, add a new
         exported function `truncateForStorageBytes(text, maxBytes = 4000)`:
         - encode the string to a Uint8Array via `TextEncoder`
         - truncate at maxBytes
         - walk back to a valid UTF-8 sequence start (the first byte of
           a multi-byte sequence has the high bit pattern
           0xxxxxxx, 110xxxxx, 1110xxxx, or 11110xxx â€” anything
           else is a continuation byte 10xxxxxx and must be discarded)
         - decode the remaining bytes back to a string via `TextDecoder`
           with `fatal: true` to catch invalid sequences
         - append `...` (3 bytes) only if the result was actually
           truncated AND the result still fits in maxBytes; otherwise
           drop the suffix
      3. Update call sites in `worker.js:851` (and any other place that
         passes a 4000-byte intent) to use the new function. Search for
         `truncateForStorage(..., 4000)`.
      4. Add tests in `apps/worker/src/lib/truncate.test.js`:
         - a string of 4-byte emoji that exceeds 4000 bytes is
           truncated without splitting a codepoint
         - the output round-trips through `TextDecoder` without error
         - input that fits is returned unchanged
         - a string that contains invalid UTF-8 (pass a Uint8Array
           directly) is handled without throwing
      5. Do NOT regress the existing `truncateForStorage` â€” keep it
         for the 500-char use cases. The new function is additive.

