  - id: d-axe-a11y
    title: 'D â€” axe-core a11y audit on onboarding, rooms, search'
    assigned_to: coder
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      GOAL: Install axe-core + @axe-core/playwright in
      `apps/dashboard`, run it against onboarding (all 5 steps), rooms
      list, and search pages, fix every Critical and Serious violation,
      and add a permanent Playwright assertion that the critical/serious
      count is zero.

      PROCESS:
      1. From `apps/dashboard/`, run
         `pnpm add -D axe-core @axe-core/playwright` (or use the
         existing `devDependencies` if axe-core is already present â€”
         search first).
      2. Read `apps/dashboard/playwright.config.ts` (already exists).
         Add a new spec file `apps/dashboard/e2e/a11y.axe.spec.ts`
         that:
         - extends `test` from `@playwright/test`
         - imports `AxeBuilder` from `@axe-core/playwright`
         - for each of the 5 onboarding steps, the rooms list, and
           the search page:
           - navigates to the page (use the same routes the smoke
             specs already use; check `apps/dashboard/e2e/onboarding.smoke.spec.ts`
             for the route patterns)
           - runs `await new AxeBuilder({ page }).analyze()`
           - logs every violation as
             `[{rule, impact, elements, helpUrl}]` for the report
           - asserts
             `expect(violations.filter(v => v.impact === 'critical' || v.impact === 'serious')).toHaveLength(0)`
         - uses `test.describe.parallel` if independent, but respects
           the existing `fullyParallel: false` setting in the config
      3. For each Critical or Serious violation you find, fix the
         React source under `apps/dashboard/app/...`. Common fixes:
         - missing `alt` text on `<img>` â†’ add it
         - `<button>` with no accessible name â†’ add `aria-label` or
           visible text
         - missing form labels â†’ wrap with `<label>` or add
           `htmlFor`
         - color contrast failures â†’ adjust the Tailwind classes
         - landmark / heading hierarchy â†’ add `<h1>`, `<main>`,
           `<nav aria-label=...>` where missing
      4. Do NOT add tests that require Clerk auth to be configured
         â€” if a page redirects to /sign-in without auth, mark the
         test `test.skip()` and add a `// TODO: enable when
         test-mode auth is wired` comment.
      5. Add the new spec to the `playwright.config.ts` `testMatch`
         so it runs in non-CI mode too. (Current config: in CI only
         `*.smoke.spec.ts` runs. Add a11y.axe.spec.ts to the CI list
         so it ships green.)
      6. Run `pnpm --filter @fluxy-chat/dashboard test:e2e:smoke` to
         confirm no regression in existing specs, then run the new
         spec with `pnpm exec playwright test e2e/a11y.axe.spec.ts`.
      7. Report every violation you found (Critical/Serious AND
         Moderate/Minor) in deliverable.md, even if you only fixed
         Critical/Serious.

