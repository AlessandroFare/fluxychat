  - id: b-cascade-deletes
    title: 'B-1 cascade deletes migration 0142'
    assigned_to: coder
    verified_by: verifier
    timeout_ms: 1200000
    prompt: |
      GOAL: Migration `apps/worker/db/0142_cascade_deletes.sql` that adds
      ON DELETE CASCADE foreign keys on attachments, message_mentions,
      message_reactions, read_receipts, agent_runs â†’ messages.

      SQLite does not support `ALTER TABLE ... ADD CONSTRAINT` directly.
      Use the standard SQLite 12-step recipe:
      1. `PRAGMA foreign_keys=OFF;`
      2. `BEGIN TRANSACTION;`
      3. For each child table:
         - `CREATE TABLE <name>_new (... FOREIGN KEY(message_id)
            REFERENCES messages(id) ON DELETE CASCADE);` with all
            other columns preserved exactly
         - `INSERT INTO <name>_new SELECT ... FROM <name>;`
         - `DROP TABLE <name>;`
         - `ALTER TABLE <name>_new RENAME TO <name>;`
         - Recreate any indexes on the table (capture from
           `db-reference/schema-snapshot.sql` or `baseline/0136_schema.sql`).
      4. `COMMIT;`
      5. `PRAGMA foreign_keys=ON;` (in the application at connection
         time â€” DO NOT toggle in migration; document the requirement
         in a comment in the migration file).
      6. Make it idempotent: check `sqlite_master` for the new FK
         constraint name before recreating each table. Use a pattern
         like:
         ```
         SELECT 1 FROM sqlite_master
         WHERE type='table' AND name='<name>_new' LIMIT 1;
         ```
         and skip if present.
      7. The migration file must be a single `db.execute(sql)`-style
         string of SQL statements separated by `;\n` (check
         0141_automation_idempotency.sql for the project's convention).
      8. Run `pnpm --filter @fluxy-chat/worker test` and confirm no
         regression.
      9. Verify the cascade actually fires by adding a one-off Node
         script `scripts/verify-cascade-deletes.mjs` that creates a
         test row in messages, inserts a child row, deletes the
         message, and asserts the child row is gone. Document the
         command in deliverable.md but DO NOT commit a destructive
         script that runs in CI.
      DO NOT change any application code. This is a schema-only task.

