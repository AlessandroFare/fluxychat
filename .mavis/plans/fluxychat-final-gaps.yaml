  - id: a-saml-signature
    title: 'A-3 SAML signature verification with crypto.subtle.verify'
    assigned_to: coder
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      GOAL: Replace the stub in `apps/worker/src/lib/sso-saml.js:parseSamlAssertion()`
      with a real SAML XMLDSig signature verification using
      `crypto.subtle.importKey` + `crypto.subtle.verify`.

      CURRENT STATE: The function at line 205 returns
      `{ isValid: false, reason: "saml_signature_verification_unimplemented" }`
      on every call. Replace the body (after the early-return validation at
      lines 212-220) with a real verifier.

      REQUIREMENTS:
      1. Parse the SAML response XML to locate:
         - The IdP certificate (already on `config.idp_certificate`, strip
           PEM headers/whitespace to get raw DER bytes).
         - The signed element's SignatureValue (base64) and SignedInfo
           canonicalization.
         - The reference URI (for enveloped or detached signatures per
           config.want_response_signed / want_assertions_signed).
      2. Use `crypto.subtle.importKey("raw", derBytes, { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, false, ["verify"])`
         for RSA-SHA256 (the SAML 2.0 default). Fall back to SHA-1 only if
         the SignedInfo declares SHA-1 and document that choice.
      3. Use `crypto.subtle.verify("RSASSA-PKCS1-v1_5", publicKey, sigBytes, signedInfoBytes)`.
      4. Respect `config.want_response_signed` and `config.want_assertions_signed`:
         if either is true and verification fails, return `{ isValid: false, reason: "signature_invalid" }`.
         If neither is required, return `{ isValid: true, ... }` after
         issuer/audience checks pass.
      5. Keep the existing exported function signature
         `parseSamlAssertion(encodedResponse, config)`. The caller in
         `apps/worker/src/routes/identity-access-http.js` consumes
         `{ isValid, reason, issuer, ...assertionFields }`.
      6. Do NOT add an `@xmldsig/xmldsig` or `xml-crypto` dependency â€” use
         the Workers-native `crypto.subtle` only. If full XML canonicalization
         (c14n) is impractical without a dependency, do a targeted
         re-serialization of the SignedInfo block and document that residual
         risk in a comment. A naive `textContent` compare is NOT acceptable.
      7. Add tests in `apps/worker/src/lib/sso-saml.test.js`:
         - valid signature passes
         - tampered signature (flip one byte of SignatureValue) returns
           `isValid: false, reason: "signature_invalid"`
         - missing/empty `idp_certificate` returns
           `isValid: false, reason: "idp_certificate_missing"`
         - unsigned response when `want_assertions_signed=true` returns
           `isValid: false, reason: "assertion_signature_required"`
      8. Generate a self-signed RSA cert + a valid signed SAML response for
         the test using Node's `crypto.generateKeyPairSync` + a hand-rolled
         SignedInfo â€” commit the cert (PEM) and the response as test
         fixtures in `apps/worker/src/lib/__fixtures__/saml/`. Do NOT
         commit a real IdP cert.
      9. If you discover that crypto.subtle on Workers cannot import a raw
         RSA public key (only SPKI), use `importKey("spki", ...)` and
         wrap the PEM cert body accordingly.
      10. Re-run `pnpm --filter @fluxy-chat/worker test` and report the
          pass/fail count delta.

      DO NOT TOUCH:
      - The public API contract of /saml/acs route.
      - The migrations directory (no schema change needed for this fix).
      - Any other lib/ file outside sso-saml.js and its test.

  - id: a-ssrf-coverage-audit
    title: 'A-1 SSRF: audit coverage and add residual-risk comments'
    assigned_to: coder
    verified_by: verifier
    timeout_ms: 1800000
    prompt: |
      GOAL: Ensure every user-supplied URL passed to `fetch()` is routed
      through the existing `assertSafeOutboundUrl` / `safeOutboundFetch`
      helpers in `apps/worker/src/lib/url-ssrf.js`. Add the
      `// SECURITY: SSRF_RESIDUAL` comment at every callsite that performs
      a live fetch to a user-controlled URL where DNS-rebinding is the
      only remaining attack vector.

      PROCESS:
      1. Read `apps/worker/src/lib/url-ssrf.js` to confirm the exported
         helpers (`isPrivateUrl`, `assertSafeOutboundUrl`,
         `safeOutboundFetch`, and any error-code constants).
      2. Use `rg -l "fetch\\("` against `apps/worker/src/src` and
         filter to calls where the URL is derived from a request body,
         query param, header, or any user-controlled source. Likely
         locations: `webhook-delivery.js`, `agent-tools.js`,
         `browser-run.js`, `agent-runtime.js`, `llm-providers.js`, and any
         image-proxy / link-preview route.
      3. For EACH callsite that takes a user-controlled URL:
         - If it already calls `assertSafeOutboundUrl` or
           `safeOutboundFetch` â†’ no change, just verify and note in the
           report.
         - If it does a raw `fetch(userUrl)` â†’ wrap it.
         - For every callsite that does a raw `fetch()` to a non-user
           URL (e.g. LLM provider baseUrl from env), add a single
           `// SECURITY: SSRF_RESIDUAL` comment block above the call
           explaining that the URL is from `env.*` (operator-controlled,
           not request-controlled) and that DNS rebinding is the only
           residual risk because Workers cannot resolve DNS before
           connecting.
      4. The error shape on a block must be
         `{ error: "SSRF_BLOCKED", reason: <short string> }` with
         HTTP 400. Confirm the existing helper throws that; if not,
         adjust the caller to wrap.
      5. Add tests in `apps/worker/src/lib/url-ssrf.test.js` (or extend
         if it exists â€” it does, at apps/worker/src/lib/url-ssrf.test.js):
         - `http://127.0.0.1/` blocked
         - `http://10.0.0.1/` blocked
         - `file:///etc/passwd` blocked
         - `https://example.com/foo` allowed
         - the helper throws with `error: "SSRF_BLOCKED"` on the
           blocked cases
      6. Do NOT add a `dns.resolve` polyfill â€” Workers cannot do DNS
         resolution before `fetch()`. Document that once in the helper
         file's top comment if it isn't already.

      DELIVERABLE: a list of every callsite touched, with the file path
      and line number, in the deliverable.md.

