# Publish FluxyChat KMP SDK — Maven Central (Android) + GitHub Release XCFramework (iOS)
name: Publish SDK KMP

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run common tests
        working-directory: packages/sdk-kmp
        run: gradle :shared:jvmTest

  publish-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Publish to Maven Central (Central Portal staging API)
        working-directory: packages/sdk-kmp
        env:
          OSSRH_USER: ${{ secrets.OSSRH_USER }}
          OSSRH_PASS: ${{ secrets.OSSRH_PASS }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASS }}
        run: |
          SDK_VERSION="${GITHUB_REF_NAME#sdk-v}"
          echo "Publishing com.fluxychat:shared:${SDK_VERSION}"
          if [[ -z "$OSSRH_USER" ]]; then
            echo "OSSRH_USER not set — skipping Maven publish (local tag build only)"
            gradle -PsdkVersion="$SDK_VERSION" :shared:assembleRelease
            exit 0
          fi
          gradle -PsdkVersion="$SDK_VERSION" :shared:publishAndroidReleasePublicationToSonatypeRepository :shared:publishJvmPublicationToSonatypeRepository
          AUTH=$(printf '%s:%s' "$OSSRH_USER" "$OSSRH_PASS" | base64 -w0)
          curl -sfS -X POST \
            -H "Authorization: Bearer $AUTH" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.fluxychat?publishing_type=automatic"

  publish-ios:
    needs: test
    runs-on: macos-14
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build iOS frameworks
        working-directory: packages/sdk-kmp
        run: gradle :shared:linkReleaseFrameworkIosArm64 :shared:linkReleaseFrameworkIosSimulatorArm64
      - name: Upload XCFramework zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FRAME_DIR="packages/sdk-kmp/shared/build/bin/iosArm64/releaseFramework"
          if [[ ! -d "$FRAME_DIR" ]]; then
            echo "Framework output not found — skip release asset"
            exit 0
          fi
          cd "$FRAME_DIR"
          zip -r FluxyChatSDK.xcframework.zip FluxyChatSDK.framework 2>/dev/null || zip -r FluxyChatSDK.xcframework.zip .
          gh release upload "$TAG" FluxyChatSDK.xcframework.zip --clobber || gh release create "$TAG" FluxyChatSDK.xcframework.zip
