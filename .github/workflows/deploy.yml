name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Consistency checks
        run: |
          pnpm run check:pricing
          pnpm run check:tenant-scope
          pnpm run check:openapi
          pnpm run check:do-bindings

      - name: Worker typecheck (ENG-06)
        run: pnpm --filter @fluxychat/worker typecheck

      - name: Test
        run: pnpm test

  deploy-worker:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate environment input
        run: |
          if ! echo "${{ inputs.environment }}" | grep -qE '^(staging|production)$'; then
            echo "::error::Invalid environment: ${{ inputs.environment }}"
            exit 1
          fi

      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            pnpm exec wrangler deploy src/worker.js --config wrangler.staging.toml
          else
            pnpm exec wrangler deploy src/worker.js
          fi
