name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages for dashboard tests
        run: pnpm --filter @fluxychat/protocol build && pnpm --filter @fluxy-chat/config build && pnpm --filter @fluxy-chat/sdk build && pnpm --filter @fluxy-chat/react build

      - name: Pricing consistency check (P0-1 / ENG-03)
        run: pnpm run check:pricing

      - name: Tenant-scope audit (P1 ENG-07)
        run: pnpm run check:tenant-scope

      - name: Build publishable packages (docs bin + manifest smoke)
        run: pnpm --filter @fluxy-chat/create-fluxy-chat build

      - name: Publish manifest verify (DX-14 / DX-14.1)
        run: pnpm run check:publish-manifest

      - name: SDK bundle size report (DX-16.1)
        run: pnpm run check:bundle-size

      - name: OpenAPI route smoke (ENG-14)
        run: pnpm run check:openapi

      - name: DO bindings check (ENG-12)
        run: pnpm run check:do-bindings

      - name: Environment readiness hints
        run: pnpm run check:env

      - name: Worker typecheck (ENG-06)
        run: pnpm --filter @fluxychat/worker typecheck

      - name: Build dashboard
        run: pnpm --filter @fluxychat/dashboard build

      - name: Build docs site
        run: pnpm run docs:build

      - name: Smoke test create-fluxy-chat scaffold
        run: pnpm run smoke:create-fluxy-chat

      - name: Dependency audit (high/critical)
        run: pnpm audit --audit-level=high

      - name: Test
        run: pnpm test

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Onboarding smoke (Playwright)
        working-directory: apps/dashboard
        env:
          CI: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          CLERK_SECRET_KEY: ""
          NEXT_PUBLIC_FLUXYCHAT_WORKER_URL: http://127.0.0.1:8787
        run: pnpm test:e2e:smoke

  # Manual only: needs wrangler .dev.vars + E2E_ADMIN_JWT (see apps/dashboard/playwright.integrated.config.ts).
  e2e-integrated:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium

      - name: Onboarding integrated (worker + dashboard)
        working-directory: apps/dashboard
        env:
          CI: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
          CLERK_SECRET_KEY: ""
          NEXT_PUBLIC_FLUXYCHAT_WORKER_URL: http://127.0.0.1:8787
          E2E_ADMIN_JWT: ${{ secrets.E2E_ADMIN_JWT }}
        run: pnpm test:e2e:integrated
