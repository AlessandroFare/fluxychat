  /messages/{id}/deliveries:
    get:
      summary: List per-recipient delivery status for a message
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery list for message author or room member

  /push/devices:
    get:
      summary: List registered push devices for caller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device list (token preview only)
    post:
      summary: Register FCM or web push device token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [fcm, web]
                token:
                  type: string
      responses:
        "200":
          description: Device registered

  /push/devices/{id}:
    delete:
      summary: Unregister a push device
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device removed

  /push/web/vapid-public-key:
    get:
      summary: VAPID public key for web push subscription
      description: Public endpoint (no JWT). Clients need this key before `pushManager.subscribe`.
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: VAPID public key and subject
        "400":
          description: projectId required
        "503":
          description: VAPID not configured

  /push/web/subscribe:
    post:
      summary: Register a web push subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
                userAgent:
                  type: string
      responses:
        "200":
          description: Subscription stored
        "400":
          description: Invalid subscription payload
        "401":
          description: Unauthorized

  /push/web/subscriptions:
    get:
      summary: List web push subscriptions for the caller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription list (endpoint previews)
        "401":
          description: Unauthorized

  /push/web/subscribe/{endpointId}:
    delete:
      summary: Unregister a web push subscription
      security:
        - bearerAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription removed
        "400":
          description: Invalid endpoint id
        "401":
          description: Unauthorized

  /blocks:
    get:
      summary: List users blocked by the caller
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
    post:
      summary: Block a user (global, project-scoped)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: User blocked

  /blocks/{userId}:
    delete:
      summary: Unblock a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unblocked

  /messages/{id}/reactions:
    post:
      summary: Add reaction
