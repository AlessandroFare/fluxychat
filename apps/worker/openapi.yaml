        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageBase64
              properties:
                imageBase64:
                  type: string
                roomId:
                  type: string
                frameIndex:
                  type: integer
                messageId:
                  type: integer
      responses:
        "200":
          description: "Analysis - ok, severity, safe, analysis"
        "400":
          description: imageBase64 required or moderation rejected the frame
        "404":
          description: not_found
        "503":
          description: visual_moderation_disabled
  /api/live/events/{eventId}/join:
    post:
      summary: Join as viewer (userId from the JWT)
      description: "Idempotent; returns the viewer id and alreadyJoined on repeat calls."
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Viewer row - { id, alreadyJoined? }"
  /api/live/events/{eventId}/leave:
    post:
      summary: Mark the caller's viewer row as left
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Leave ack - { left }"
  /api/live/events/{eventId}/viewers:
    get:
      summary: List viewers (role filter, default limit 100)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Viewer rows (userId, username, role, joinedAt, leftAt, isBanned, isMuted)
  /api/live/events/{eventId}/viewer-count:
    get:
      summary: Current viewer count
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Count - { count }"
  /api/live/events/{eventId}/peak:
    get:
      summary: Peak and total viewers recorded for the event
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Peak - { peakViewers, totalViewers }"
    post:
      summary: Recompute the peak from the current viewer count
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Updated peak - { peakViewers }"
  /api/live/events/{eventId}/ban:
    post:
      summary: Ban a viewer from the event chat
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: "Ban ack - { banned }"
  /api/live/events/{eventId}/mute:
    post:
      summary: Mute or unmute a viewer in the event chat
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                muted:
                  type: boolean
      responses:
        "200":
          description: "Mute ack - { muted }"
  /api/live/events/{eventId}/pin:
    post:
      summary: Pin a chat message (OBS overlay friendly)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageId
              properties:
                messageId:
                  type: string
      responses:
        "200":
          description: "Pin id - { id }"
  /api/live/events/{eventId}/unpin:
    post:
      summary: Unpin by pin id (pinId in the body, the path segment is decorative)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pinId
              properties:
                pinId:
                  type: string
      responses:
        "200":
          description: "Unpin ack - { unpinned }"
  /api/live/events/{eventId}/pinned:
    get:
      summary: List active pinned messages
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pin rows (messageId, pinnedBy, pinnedAt, sortOrder)
  /api/live/events/{eventId}/messages:
    post:
      summary: Post a chat message as the caller
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                username:
                  type: string
                contentType:
                  type: string
                badge:
                  type: string
                color:
                  type: string
                replyToId:
                  type: string
      responses:
        "200":
          description: "Message id - { id }"
    get:
      summary: List chat messages (ascending, default limit 100, before cursor)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: string
          description: ISO timestamp cursor
      responses:
        "200":
          description: Message rows oldest first (deleted messages excluded)
  /api/live/events/{eventId}/analytics:
    post:
      summary: Upsert one per-minute analytics bucket
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - timestampBucket
              properties:
                timestampBucket:
                  type: string
                messagesCount:
                  type: integer
                viewersCount:
                  type: integer
                peakViewers:
                  type: integer
                newViewers:
                  type: integer
                uniqueChatters:
                  type: integer
                avgMessageLength:
                  type: number
                engagementRate:
                  type: number
      responses:
        "200":
          description: "Bucket id - { id }"
    get:
      summary: Buckets in [fromBucket, toBucket], ascending
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: fromBucket
          in: query
          schema:
            type: string
        - name: toBucket
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Analytics bucket rows
  /api/live/stats:
    get:
      summary: Project stream totals
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Stats - events by status, totalMessages, totalViewers"
  /api/live/events/{eventId}/angles:
    get:
      summary: List multi-camera angles (by sort order)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Angle rows (label, streamUrl, sortOrder, enabled, playbackHls)
    post:
      summary: Create an angle; provisionCloudflare gives it its own Cloudflare Stream input
      description: 503 cloudflare_angle_provision_failed when the provider call fails.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                streamUrl:
                  type: string
                sortOrder:
                  type: integer
                provisionCloudflare:
                  type: boolean
      responses:
        "200":
          description: "Angle - { id, liveInputUid, playbackHls }"
        "503":
          description: cloudflare_angle_provision_failed
  /api/live/events/{eventId}/highlights:
    get:
      summary: List timeline highlights (newest first)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Highlight rows (title, startSeconds, endSeconds, reason, clipUrl, status)
    post:
      summary: Suggest a highlight (status starts at suggested)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                startSeconds:
                  type: number
                endSeconds:
                  type: number
                reason:
                  type: string
                clipUrl:
                  type: string
      responses:
        "200":
          description: "Highlight id - { id }"
  /api/live/events/{eventId}/products:
    get:
      summary: List live-shopping products for the event
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product rows (name, checkoutUrl, priceAmount, inventoryQty, moq, unitsSold)
    post:
      summary: Create or update a product by id (external https checkout, optional Stripe price)
      description: "checkout_url is validated https. With stripePriceId the project's Stripe secret is required (stripe_not_configured otherwise). 404 event_not_found."
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                imageUrl:
                  type: string
                checkoutUrl:
                  type: string
                stripePriceId:
                  type: string
                checkoutProvider:
                  type: string
                priceAmount:
                  type: integer
                currency:
                  type: string
                inventoryQty:
                  type: integer
                moq:
                  type: integer
      responses:
        "200":
          description: "Product - { product }"
        "400":
          description: Validation error (bad URL, missing fields)
        "404":
          description: event_not_found
  /api/live/events/{eventId}/products/{productId}/show:
    post:
      summary: Show the product to the audience
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Product - { product }"
        "404":
          description: product_not_found
  /api/live/events/{eventId}/products/{productId}/checkout-click:
    post:
      summary: Record a checkout click; decrements inventory and enforces MOQ
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                successUrl:
                  type: string
                cancelUrl:
                  type: string
      responses:
        "200":
          description: Checkout result (checkoutUrl, paymentStatus, quantity, product)
        "400":
          description: Validation error
        "404":
          description: product_not_found
        "409":
          description: insufficient_inventory or below_moq
  /api/live/events/{eventId}/replays:
    get:
      summary: List replays for the event (Cloudflare-synced and manual)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "List - { replays }"
    post:
      summary: Register a manual replay (validated https playback URLs)
      description: 404 event_not_found; other validation errors are 400.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - playbackHls
              properties:
                playbackHls:
                  type: string
                playbackDash:
                  type: string
                label:
                  type: string
                thumbnailUrl:
                  type: string
                durationSeconds:
                  type: number
                angleId:
                  type: string
                offsetMs:
                  type: integer
                syncGroupId:
                  type: string
      responses:
        "200":
          description: "Replay - { replay }"
        "400":
          description: Validation error
        "404":
          description: event_not_found
  /api/live/events/{eventId}/replays/reconcile:
    post:
      summary: Pull finished Cloudflare Stream videos into replays
      description: Needs the Cloudflare Stream secrets (503 cloudflare_stream_not_configured) and a provisioned live input.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Reconcile result - { replays, synced, syncGroupId? }"
        "404":
          description: event_not_found
        "503":
          description: cloudflare_stream_not_configured
        "502":
          description: Upstream provider failure
  /api/live/events/{eventId}/replays/reconcile-angles:
    post:
      summary: Reconcile per-angle replays into a sync group
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Reconcile result - { replays, synced, syncGroupId? }"
        "400":
          description: no_live_input or other reconciliation error
        "503":
          description: cloudflare_stream_not_configured
        "502":
          description: Upstream provider failure
  /api/live/events/{eventId}/replay:
    get:
      summary: Replay bundle - primary replay, per-angle replays and the chat timeline
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Bundle - replay, angleReplays, syncGroupId, chatTimeline"
  /api/live/events/{eventId}/replay/primary:
    get:
      summary: Primary replay for the event (or null)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Primary replay - { replay }"
  /api/live/events/{eventId}/gifts:
    get:
      summary: List gifts/tips for the event
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gift rows (giftType, amount, currency, paymentStatus)
    post:
      summary: Record a gift/tip (payment_status starts pending)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                giftType:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                userId:
                  type: string
      responses:
        "200":
          description: "Gift id - { id }"
  /api/live/events/{eventId}/sentiment:
    get:
      summary: Sentiment buckets by minute (read-only contract)
      description: The Worker currently has no producer for this table - populate live_stream_sentiment from your own analytics pipeline.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sentiment rows (timestampBucket, positive, neutral, negative, score)
  /api/live/turn-credentials:
    get:
      summary: Ephemeral TURN credentials for WebRTC relay
      description: "HMAC credentials when TURN_SECRET is set (Coturn REST pattern), Metered.ca proxy when TURN_API_URL and TURN_API_KEY are set; otherwise a public STUN fallback with an explicit note. Relay infrastructure is the integrator's."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "iceServers and ttl (3600)"
  /overlays:
    post:
      summary: Create an OBS-ready overlay card for a room (admin or owner JWT)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - roomId
              properties:
                name:
                  type: string
                roomId:
                  type: string
                overlayType:
                  type: string
                config:
                  type: object
                style:
                  type: object
                refreshSeconds:
                  type: integer
      responses:
        "201":
          description: The overlay
        "400":
          description: name and roomId required
    get:
      summary: List overlays (optional roomId filter)
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "List - { overlays, count }"
  /overlays/{overlayId}:
    get:
      summary: One overlay
      security:
        - bearerAuth: []
      parameters:
        - name: overlayId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The overlay
        "404":
          description: not_found
    patch:
      summary: Partial overlay update (admin or owner JWT)
      security:
        - bearerAuth: []
      parameters:
        - name: overlayId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated overlay
        "400":
          description: Invalid patch
    delete:
      summary: Delete the overlay (admin or owner JWT)
      security:
        - bearerAuth: []
      parameters:
        - name: overlayId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Deletion ack - { ok }"
  /overlays/{overlayId}/widget:
    get:
      summary: Widget payload for OBS browser sources (no auth)
      description: Meant to be embedded in a browser source; no JWT is required on this path.
      parameters:
        - name: overlayId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Widget payload
        "404":
          description: not_found
