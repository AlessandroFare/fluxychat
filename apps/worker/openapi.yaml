openapi: 3.1.0
info:
  title: Fluxychat Realtime API
  version: "1.0.0"
  description: |
    HTTP+WebSocket API for the Fluxychat real-time messaging platform.
    This spec focuses on the REST surface exposed by the Cloudflare Worker.
    Operational smoke checks against this contract: `scripts/smoke-test.sh` (see README `pnpm smoke:bundled`).

servers:
  - url: https://api.fluxychat.example.com
    description: Production
  - url: http://127.0.0.1:8787
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    fluxyApiKey:
      type: apiKey
      in: header
      name: X-Fluxy-Api-Key
      description: |
        Project API key (prefix `fc_...`). The worker also accepts the same value as query parameter `apiKey`.

  schemas:
    Message:
      type: object
      properties:
        id:
          type: integer
        roomId:
          type: string
        senderId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true

    Reaction:
      type: object
      properties:
        messageId:
          type: integer
        roomId:
          type: string
        userId:
          type: string
        emoji:
          type: string
        op:
          type: string
          enum: [add, remove]

security:
  - bearerAuth: []

paths:
  /.well-known/oauth-protected-resource:
    get:
      summary: OAuth protected resource metadata (RFC 9728)
      description: Unauthenticated discovery for MCP Bearer clients (`resource` is `/mcp`).
      security: []
      responses:
        "200":
          description: Protected resource metadata
  /.well-known/oauth-protected-resource/mcp:
    get:
      summary: OAuth protected resource metadata (MCP path suffix)
      description: Same document as `/.well-known/oauth-protected-resource` for clients that append the resource path.
      security: []
      responses:
        "200":
          description: Protected resource metadata
  /auth/token:
    post:
      summary: Mint a short-lived JWT
      description: |
        Server-side token minting for SDKs. Authenticates the project via API key (not Bearer JWT).
      security:
        - fluxyApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, roles]
              properties:
                userId:
                  type: string
                  description: Subject claim (`sub`); 1–128 chars, alphanumeric with `_` `-`.
                roles:
                  type: array
                  items:
                    type: string
                  description: JWT role claims (e.g. member, admin, owner).
                ttlSeconds:
                  type: integer
                  description: Token lifetime in seconds (clamped 60–86400; default 3600).
      responses:
        "200":
          description: Signed JWT and echo of claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresIn:
                    type: integer
                  claims:
                    type: object
        "400":
          description: Bad request (missing userId, invalid roles, or project secret not configured)
        "401":
          description: Missing or invalid API key

  /auth/signin:
    post:
      summary: Sign in user (JWT + user channel paths)
      description: |
        Same as `/auth/token` but includes `userChannel` paths for Pusher-style per-user events
        (`/ws/user/:userId` and `POST /users/:userId/events`).
      security:
        - fluxyApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, roles]
              properties:
                userId:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                ttlSeconds:
                  type: integer
      responses:
        "200":
          description: JWT plus user channel metadata

  /tokens/link-guest:
    post:
      summary: Claim a guest identity into a signed-in account (guest → account linking)
      description: |
        The caller (Bearer JWT, non-guest) proves ownership of a guest identity by
        presenting its guest JWT. Room memberships move to the caller and the guest
        role upgrades to `member`; the same guest cannot be claimed twice.
        Message authorship and read markers stay under the guest user id.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestToken]
              properties:
                guestToken:
                  type: string
                  description: JWT of the guest identity (guest-only roles, same project).
      responses:
        "200":
          description: "Guest rooms moved: `{ ok: true, guestUserId, targetUserId, roomsTransferred, roomsAlreadyMember }`"
        "400":
          description: Missing/invalid guest token, same user, or guest-only target
        "401":
          description: Missing or invalid caller token
        "409":
          description: Guest already linked to another account

  /auth/sms-otp/send:
    post:
      summary: Send SMS OTP via Sent.dm AUTHENTICATION template
      security:
        - fluxyApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, e164]
              properties:
                userId:
                  type: string
                e164:
                  type: string
      responses:
        "200":
          description: OTP sent

  /auth/sms-otp/verify:
    post:
      summary: Verify SMS OTP and mint JWT
      security:
        - fluxyApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, e164, code]
              properties:
                userId:
                  type: string
                e164:
                  type: string
                code:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: JWT with sms_verified claim

  /auth/channel:
    post:
      summary: Pusher-compatible channel auth
      description: |
        Returns `{ auth, channel_data? }` for private/presence channel subscription during Pusher migration.
        Requires Bearer JWT. Accepts `socket_id` + `channel_name` or `roomId`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socket_id]
              properties:
                socket_id:
                  type: string
                socketId:
                  type: string
                channel_name:
                  type: string
                channelName:
                  type: string
                roomId:
                  type: string
                presenceInfo:
                  type: object
      responses:
        "200":
          description: Signed channel auth string
        "403":
          description: Not allowed to access room

  /client/feature-flags:
    get:
      summary: Client feature flags (P12-J)
      description: |
        Public endpoint. Pass optional Bearer JWT for user/project targeting via Flagship.
        Falls back to env vars when `env.FLAGS` is not bound.
      security: []
      responses:
        "200":
          description: Boolean flags + reconnect backoff profile for SDK
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: object
                    additionalProperties:
                      type: boolean
                  flagship:
                    type: boolean
                  reconnectBackoff:
                    type: object
                    properties:
                      baseBackoffMs:
                        type: integer
                      maxBackoffMs:
                        type: integer

  /public/host-config:
    get:
      summary: White-label host → project config (P12-G)
      description: Returns project branding when the request Host matches an active custom domain.
      security: []
      responses:
        "200":
          description: |
            Host config or `{ configured: false }`

  /public/embed-config:
    get:
      summary: Public embed widget metadata (P12-A)
      security: []
      responses:
        "200":
          description: Enabled flag, default room, theme, z-index

  /embed.js:
    get:
      summary: Embeddable widget loader IIFE (P12-A)
      security: []
      responses:
        "200":
          description: JavaScript loader for chat bubble + iframe

  /embed/frame:
    get:
      summary: Embed iframe chat shell (P12-A)
      security: []
      parameters:
        - name: roomId
          in: query
          schema:
            type: string
        - name: parentOrigin
          in: query
          schema:
            type: string
      responses:
        "200":
          description: HTML chat frame

  /admin/embed-config:
    get:
      summary: Read embed widget config + install snippet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Config and HTML snippet
    patch:
      summary: Update embed widget config
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                defaultRoomId:
                  type: string
                  nullable: true
                allowedOrigins:
                  type: array
                  items:
                    type: string
                zIndex:
                  type: integer
                launcherTitle:
                  type: string
                theme:
                  type: object
                  properties:
                    primaryColor:
                      type: string
                    position:
                      type: string
                      enum: [bottom-right, bottom-left]
      responses:
        "200":
          description: Updated config

  /admin/custom-domains:
    get:
      summary: List custom domains for the project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Domain list
    post:
      summary: Register a custom hostname
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname:
                  type: string
                defaultRoomId:
                  type: string
                brandName:
                  type: string
                brandLogoUrl:
                  type: string
                allowedOrigins:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Created

  /admin/custom-domains/{id}:
    patch:
      summary: Update domain status or branding
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, active, disabled]
                defaultRoomId:
                  type: string
                brandName:
                  type: string
      responses:
        "200":
          description: Updated
    delete:
      summary: Remove custom domain
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /public/rooms/{roomId}/guest-session:
    post:
      summary: Anonymous guest JWT for a public room
      description: |
        Sendbird-style open channel join. Requires `PUBLIC_GUEST_ENABLED=true` on the Worker.
        Returns a short-lived JWT with role `guest` (read-only by default).
      security: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                turnstileToken:
                  type: string
      responses:
        "200":
          description: Guest session token
        "403":
          description: Room is not public
        "404":
          description: Feature disabled or room not found

  /users/{userId}/events:
    post:
      summary: Trigger user-targeted event
      description: |
        Delivers to the user's dedicated channel (User Durable Object) and optionally fans out
        to room WebSockets where the user is a member. JWT required; caller must be the user or admin/owner.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                data:
                  description: Event payload
                excludeSocketId:
                  type: string
                fanoutRooms:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Delivery counts
        "403":
          description: Forbidden

  /users/{userId}/connections:
    delete:
      summary: Terminate user WebSocket connections
      description: |
        Closes all connections on the user channel and in rooms where the user is a member.
        Admin/owner can terminate any user; members can terminate their own connections.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Count of closed sockets

  /users/{userId}/watchlist:
    get:
      summary: List watchlist targets
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Watchlist entries
    post:
      summary: Add watchlist target (room or user)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, targetId]
              properties:
                type:
                  type: string
                  enum: [room, user]
                targetId:
                  type: string
      responses:
        "200":
          description: Target added
    delete:
      summary: Remove watchlist target
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Target removed

  /billing/checkout:
    post:
      summary: Create Stripe Checkout session
      description: |
        Returns a hosted Checkout URL when `STRIPE_SECRET_KEY` is configured; otherwise `501` with `billing_not_configured`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                planName:
                  type: string
                  description: Target plan (e.g. starter, pro).
                successUrl:
                  type: string
                cancelUrl:
                  type: string
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  sessionId:
                    type: string
        "401":
          description: Unauthorized
        "501":
          description: Stripe not configured on this deployment
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: billing_not_configured

  /billing/plan:
    get:
      summary: Current plan and monthly usage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plan row plus usage counters for current UTC month
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: object
                  usage:
                    type: object
                    additionalProperties:
                      type: integer
                  monthKey:
                    type: string
        "401":
          description: Unauthorized

  /billing/portal:
    post:
      summary: Stripe Customer Portal session
      description: Requires Stripe configuration; returns portal URL or error.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                returnUrl:
                  type: string
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        "401":
          description: Unauthorized
        "501":
          description: Stripe not configured

  /gdpr/delete:
    delete:
      summary: GDPR right to erasure
      description: Requires JWT with owner or admin role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Erasure completed (may include partial_erasure warnings)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  partial_erasure:
                    type: boolean
                  remaining_counts:
                    type: object
                    additionalProperties:
                      type: integer
        "401":
          description: Unauthorized
        "403":
          description: Caller is not owner/admin

  /gdpr/export:
    get:
      summary: GDPR data portability export
      description: Returns a JSON attachment with the authenticated user's data in the project.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: JSON export (attachment disposition)
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized

  /health:
    get:
      summary: Health check
      description: No authentication. Reports D1/DO presence and optional KV/R2 degradation.
      security: []
      responses:
        "200":
          description: Critical dependencies OK (optional services may still be missing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  ts:
                    type: integer
                  version:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                  degraded:
                    type: boolean
                  degradedFeatures:
                    type: object
                    additionalProperties:
                      type: string
                  platformBindings:
                    type: object
                    description: P12-J/K/L platform binding status
                    additionalProperties:
                      type: string
        "503":
          description: Critical dependency missing (e.g. database)

  /approvals/require:
    post:
      summary: Open an ephemeral room for a tool approval
      description: JWT. Creates a group room plus a HITL row. For agents that never adopted chat UI.
      responses:
        "200":
          description: roomId and approvalId
        "401":
          description: Unauthorized

  /api/hitl/metrics:
    get:
      summary: HITL fatigue counts for the tenant
      description: Pending rows, decisions in the last 24h, distinct current approvers. Counts, not a score.
      responses:
        "200":
          description: metrics object
        "401":
          description: Unauthorized

  /api/hitl/approvals:
    get:
      summary: List pending HITL approvals
      description: Query `roomId` or `approverId=me`.
      responses:
        "200":
          description: approvals array
        "401":
          description: Unauthorized

  /api/hitl/approvals/{id}/evidence:
    get:
      summary: Evidence pack for one HITL request
      description: Snapshot of tool, chain, and decision fields. Room membership required.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: evidence object
        "404":
          description: Not found

  /api/hitl/slack-user-map:
    get:
      summary: Slack user id map for HITL
      responses:
        "200":
          description: mappings
    put:
      summary: Upsert Slack user map
      responses:
        "200":
          description: mapping
    delete:
      summary: Delete Slack user map
      responses:
        "200":
          description: ok

  /admin/scheduled/run:
    post:
      summary: Run a scheduled cron job manually (P12-L ops)
      description: |
        Owner/admin only. Triggers digest, notification batch flush, retention purge,
        or webhook delivery flush without waiting for Workflow schedules.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron]
              properties:
                cron:
                  type: string
                  enum:
                    - "0 8 * * *"
                    - "*/15 * * * *"
                    - "0 3 * * *"
                    - "*/5 * * * *"
      responses:
        "200":
          description: Job completed
        "400":
          description: Invalid cron expression
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /events:
    post:
      summary: Trigger events (multi-room)
      description: |
        Pusher-style HTTP trigger. Broadcast a custom or built-in event to up to 50 rooms.
        JWT required; caller must be a member of each room (or project admin/owner).
        Pass `excludeSocketId` (or `socket_id`) to skip the originating WebSocket connection.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomIds]
              properties:
                roomIds:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                name:
                  type: string
                  description: Custom event name (broadcast as server_event)
                data:
                  description: Payload for custom events
                event:
                  type: object
                  description: Full announce payload (type message, edit, etc.)
                excludeSocketId:
                  type: string
                socket_id:
                  type: string
      responses:
        "200":
          description: Trigger result
        "401":
          description: Unauthorized
        "403":
          description: Not a member of one or more rooms

  /messages:
    post:
      summary: Create message
      description: Create a new message in a room (JWT with `sub` and `tid` required).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, content]
              properties:
                roomId:
                  type: string
                content:
                  type: string
                replyTo:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Created message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        "400":
          description: Invalid roomId or content
        "401":
          description: Unauthorized
        "402":
          description: Monthly project quota exceeded (`quota_exceeded`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: quota_exceeded
                  metric:
                    type: string
                  limit:
                    type: integer
                  used:
                    type: integer
                  month:
                    type: string
                  resetsAt:
                    type: string
                    format: date-time
                  retryAfterSeconds:
                    type: integer
        "429":
          description: Per-tenant/user/room rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: rate_limit_exceeded
                  retryAfterSeconds:
                    type: integer
        "403":
          description: Caller is not allowed to post in this room

  /messages/voice:
    post:
      summary: Upload a voice message (multipart audio)
      description: |
        Records audio via multipart upload, stores in R2, inserts a `kind=voice` message,
        and asynchronously transcribes via Workers AI (`env.AI.run`) with OpenAI-compatible
        `/v1/audio/transcriptions` as BYOK fallback (`message_updated` on completion).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, roomId]
              properties:
                audio:
                  type: string
                  format: binary
                roomId:
                  type: string
                parentId:
                  type: string
                durationMs:
                  type: string
                clientMessageId:
                  type: string
      responses:
        "201":
          description: Voice message accepted (transcription pending)
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "402":
          description: Quota exceeded
        "403":
          description: Forbidden (not a room member or guest write disabled)
        "404":
          description: Room not found
        "413":
          description: Audio too large or too long
        "415":
          description: Unsupported audio format
        "429":
          description: Rate limit exceeded
        "502":
          description: R2 or AI provider failure
        "503":
          description: R2 or AI not configured

  /voice-ai/providers:
    get:
      summary: List voice AI providers
      description: |
        Returns in-worker Workers AI (Whisper STT + TTS) plus optional realtime adapters
        (OpenAI Realtime, Gemini Live) used for session metrics.
      responses:
        "200":
          description: Provider list

  /voice-ai/transcribe:
    post:
      summary: Transcribe audio in-worker (Workers AI Whisper)
      description: |
        Runs STT via `env.AI.run` (`@cf/openai/whisper-large-v3-turbo`) when the AI binding
        is present. Falls back to OpenAI-compatible `AI_BASE_URL` transcriptions when unbound.
        Optional `roomId` + `announce: true` fans out `voice_ai_transcript` on the room bus.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioBase64]
              properties:
                audioBase64:
                  type: string
                mimeType:
                  type: string
                language:
                  type: string
                roomId:
                  type: string
                announce:
                  type: boolean
      responses:
        "200":
          description: Transcript
        "400":
          description: Invalid audio
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (not a room member)
        "413":
          description: Audio too large
        "429":
          description: Rate limit exceeded
        "502":
          description: Speech provider failure
        "503":
          description: AI not configured

  /voice-ai/speak:
    post:
      summary: Synthesize speech in-worker (Workers AI TTS)
      description: |
        Runs TTS via `env.AI.run` (`@cf/myshell-ai/melotts`, fallback `@cf/deepgram/aura-1`).
        Optional `roomId` + `announce: true` fans out `voice_ai_speak` (text only, not the audio blob).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                lang:
                  type: string
                voice:
                  type: string
                roomId:
                  type: string
                announce:
                  type: boolean
      responses:
        "200":
          description: MPEG audio as base64
        "400":
          description: Missing text
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (not a room member)
        "429":
          description: Rate limit exceeded
        "502":
          description: Speech provider failure
        "503":
          description: Workers AI not bound

  /messages/suggest-replies:
    post:
      summary: AI reply suggestions for a room
      description: Returns up to three short reply suggestions based on the last messages in the room.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId]
              properties:
                roomId:
                  type: string
                parentId:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Suggestion list
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: string
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "402":
          description: Quota exceeded
        "403":
          description: Caller cannot access the room
        "429":
          description: Rate limit exceeded
        "502":
          description: AI provider failure
        "503":
          description: AI not configured

  /messages/{messageId}/summary:
    post:
      summary: Thread TL;DR on demand (P12-M)
