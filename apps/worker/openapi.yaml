            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId]
              properties:
                roomId:
                  type: string
      responses:
        "200":
          description: Thread summary
        "400":
          description: Thread too short or invalid input
        "401":
          description: Unauthorized
        "402":
          description: Quota exceeded
        "403":
          description: Forbidden
        "404":
          description: Message not found
        "429":
          description: Rate limit exceeded
        "502":
          description: AI provider failure
        "503":
          description: AI not configured

