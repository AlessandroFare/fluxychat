        content:
          application/json:
            schema:
              type: object
              properties:
                slowModeSeconds:
                  type: integer
                emoteOnly:
                  type: boolean
                subscriberOnly:
                  type: boolean
                followerOnly:
                  type: boolean
                followerMinutes:
                  type: integer
                linkProtection:
                  type: boolean
                maxMessageLength:
                  type: integer
                cooldownSeconds:
                  type: integer
      responses:
        "200":
          description: Rules id and created/updated flag
    get:
      summary: Read chat rules for the event (null when never configured)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rules object or null
  /api/live/events/{eventId}/moderate-frame:
    post:
      summary: Visual moderation of one base64 frame through the project's model
      description: "503 visual_moderation_disabled when the feature is not configured; 400 imageBase64 required. Model calls are the project's own provider budget."
