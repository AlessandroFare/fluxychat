          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Shadow: deviceId, reported, desired, updatedAt"
        "404":
          description: Unknown device
    patch:
      summary: Patch the shadow (desired as member, reported as device)
      description: "A member sends { desired } to set the target state; the device (or a member) sends { reported } to merge runtime state."
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
