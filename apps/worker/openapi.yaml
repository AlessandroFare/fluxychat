                  type: string
                  enum: [snapshot, restore]
                label:
                  type: string
                bookmark:
                  type: string
                snapshotId:
                  type: string
      responses:
        "200":
          description: Snapshot captured or restore queued
        "400":
          description: Invalid action or missing bookmark
        "401":
          description: Unauthorized
        "403":
          description: Owner/admin required

  /rooms/{id}/sealed:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read the room seal record
      description: Room member. A sealed room stopped realtime, streams, and schedules after a boot crash loop; its storage was purged. `sealed` is null when the room is healthy.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Seal status (`{ ok: true, sealed: { reason, crashes, sealedAt } | null }`)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      summary: Unseal the room
      description: Owner/admin only. Clears the seal and boot markers; the Durable Object boots light on the next wake (purged storage was not restored — use PITR snapshots for that).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unsealed (`{ ok: true, sealed: null }`)
        "401":
          description: Unauthorized
        "403":
          description: Owner/admin required

