      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery recorded

  /messages/{id}/deliveries:
    get:
      summary: List per-recipient delivery status for a message
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery list for message author or room member

  /push/devices:
    get:
