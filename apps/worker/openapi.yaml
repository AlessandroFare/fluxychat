                  type: string
      responses:
        "200":
          description: Created project + API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      apiKey:
                        type: string

  /bots:
    post:
      summary: Create or update bot/agent
      description: >
        Registers a bot/agent for the authenticated project. Bots can be used
        by external services (e.g. AI agents) to post messages into rooms.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id:
                  type: string
                  description: Optional stable identifier for the bot.
                name:
                  type: string
                webhookUrl:
                  type: string
                  description: Optional webhook URL to receive events out-of-band.
                handle:
                  type: string
                  description: >
                    Optional short handle used for mentions, e.g. "chatgpt" for @chatgpt.
                provider:
                  type: string
                  description: Optional provider identifier, e.g. "openai".
                model:
                  type: string
                  description: Optional model identifier, e.g. "gpt-4o".
                capabilities:
                  description: >
                    Optional list of capabilities, e.g. ["chat","suggest","image"].
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                config:
                  type: object
                  additionalProperties: true
                  description: Optional arbitrary configuration JSON.
      responses:
        "200":
          description: Bot/agent definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  bot:
                    type: object
                    properties:
                      id:
                        type: string
                      projectId:
                        type: string
                      name:
                        type: string
                      webhookUrl:
                        type: string
                        nullable: true
                      handle:
                        type: string
                        nullable: true
                      provider:
                        type: string
                        nullable: true
                      model:
                        type: string
                        nullable: true
                      capabilities:
                        type: array
                        items:
                          type: string

  /rooms/{id}/messages/from-bot:
    post:
      summary: Post a message as a bot/agent
      description: >
        Injects a message into the given room authored by the specified bot.
        Useful for AI agents and automations.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [botId, content]
              properties:
                botId:
                  type: string
                  description: Bot/agent identifier as registered via /bots.
                content:
                  type: string
                replyTo:
                  type: integer
                  nullable: true
                  description: Optional parent message id for replies/threads.
      responses:
        "200":
          description: Created bot message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/Message"

  /agents:
    get:
      summary: List agents (bots) for the project
