    delete:
      summary: Unregister a web push subscription
      security:
        - bearerAuth: []
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription removed
        "400":
          description: Invalid endpoint id
        "401":
          description: Unauthorized

  /blocks:
    get:
