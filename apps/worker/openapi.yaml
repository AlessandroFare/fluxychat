        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId, roomId]
              properties:
                messageId:
                  type: integer
                roomId:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Report accepted
