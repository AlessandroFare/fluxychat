    post:
      summary: Register FCM or web push device token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform:
                  type: string
                  enum: [fcm, web]
                token:
                  type: string
      responses:
        "200":
          description: Device registered

  /push/devices/{id}:
    delete:
      summary: Unregister a push device
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device removed

  /push/web/vapid-public-key:
    get:
      summary: VAPID public key for web push subscription
      description: Public endpoint (no JWT). Clients need this key before `pushManager.subscribe`.
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: VAPID public key and subject
        "400":
          description: projectId required
        "503":
          description: VAPID not configured

  /push/web/subscribe:
    post:
      summary: Register a web push subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
                userAgent:
                  type: string
      responses:
        "200":
          description: Subscription stored
        "400":
          description: Invalid subscription payload
        "401":
          description: Unauthorized

  /push/web/subscriptions:
    get:
      summary: List web push subscriptions for the caller
