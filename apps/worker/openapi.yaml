            schema:
              type: object
              properties:
                messageId:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: Pin updated; broadcasts message_pinned on WS

  /rooms/{id}/terminate-connection:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Terminate a WebSocket by socketId (moderator)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socketId]
              properties:
                socketId:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Connection closed count

  /integrations/sent/webhook:
    post:
      summary: Sent.dm delivery status webhook
      description: Updates sent_dm_deliveries when Sent reports delivery/failure. Optional HMAC via SENT_DM_WEBHOOK_SECRET.
      security: []
      responses:
        "200":
          description: Event processed

  /admin/integrations/sent/deliveries:
    get:
      summary: List Sent.dm outbound delivery records
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object

  /integrations/sent/contacts/sync:
    post:
      summary: Sync Sent.dm contact opt-out status into D1 mirror
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [e164]
              properties:
                e164:
                  type: string
                userId:
                  type: string
      responses:
        "200":
          description: Contact mirror updated

  /admin/integrations/sent/contacts:
    get:
      summary: List mirrored Sent.dm contacts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Contact rows with opt_out flag

  /rooms/{id}/e2e-key:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Fetch room E2E encryption key (members only)
      description: |
        Returns `{ e2eEnabled, roomId, e2eKey? }` when the room has end-to-end encryption enabled.
        Enable via `PATCH /rooms/{id}` with `{ "e2eEnabled": true }` (owner/admin).
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  e2eEnabled:
                    type: boolean
                  roomId:
                    type: string
                  e2eKey:
                    type: string
                    description: Base64 AES-GCM key material for SDK envelopes
        "403":
          description: Forbidden
        "404":
          description: Room not found

  /rooms/{id}/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Server-Sent Events stream for room updates
      description: Requires `Accept: text/event-stream` and room membership.
      security:
        - bearerAuth: []
      parameters:
        - name: Accept
          in: header
          required: true
          schema:
            type: string
            example: text/event-stream
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Unauthorized
        "403":
          description: Not a room member
        "406":
          description: Accept header not acceptable


