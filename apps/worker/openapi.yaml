        "200":
          description: Snooze recorded
        "403":
          description: Forbidden
    delete:
      summary: Clear room snooze
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snooze cleared

  /inbox/follow-ups:
    post:
      summary: Create an inbox follow-up flag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId]
              properties:
                roomId:
                  type: string
                messageId:
                  type: integer
                note:
                  type: string
                dueAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Follow-up created

  /inbox/follow-ups/{id}:
    patch:
      summary: Update follow-up status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, done]
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete a follow-up
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /agent-queue:
    get:
      summary: List agent tasks (P13-T4)
      description: Open and claimed tasks for operators (moderator, admin, owner roles).
      security:
        - bearerAuth: []
      parameters:
        - name: assignee
          in: query
          schema:
            type: string
            enum: [me, all]
        - name: status
          in: query
          schema:
            type: string
            enum: [resolved, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Task list with SLA metadata
        "403":
          description: Forbidden
    post:
      summary: Enqueue a room for agent handling
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId]
              properties:
                roomId:
                  type: string
                note:
                  type: string
                priority:
                  type: integer
                slaMinutes:
                  type: integer
      responses:
        "201":
          description: Task created
        "409":
          description: Room already queued

  /agent-queue/{taskId}/claim:
    post:
      summary: Claim an open task
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claimed
        "409":
          description: Not claimable

  /agent-queue/{taskId}/release:
    post:
      summary: Release a claimed task back to the queue
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Released

  /agent-queue/dispositions:
    get:
      summary: List canonical wrap-up disposition codes (P13-T5)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disposition taxonomy

  /admin/agent-queue/stats:
    get:
      summary: Resolved task counts by disposition
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Breakdown stats

  /agent-queue/{taskId}:
    patch:
      summary: Resolve or cancel a task
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [resolved, cancelled]
                disposition:
                  type: string
      responses:
        "200":
          description: Closed

  /rooms/{roomId}/handoff:
    get:
      summary: Room AI ↔ human handoff state (P12-H)
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Handoff state and optional disposition list
    post:
      summary: Human takeover from AI agent
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                note:
                  type: string
      responses:
        "201":
          description: Handoff started
    patch:
      summary: Complete handoff with disposition
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition]
              properties:
                disposition:
                  type: string
      responses:
        "200":
          description: Handoff resolved

  /messages/{id}:
    patch:
      summary: Edit message
      description: Edit an existing message (must be the original sender).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Edited message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    allOf:
                      - $ref: "#/components/schemas/Message"
                      - type: object
                        properties:
                          editedAt:
                            type: string
                            format: date-time
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      summary: Delete message
      description: Delete a message (must be the original sender).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: Forbidden
        "404":
          description: Not found

  /messages/{id}/poll:
    get:
      summary: Get poll results for a poll message
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Poll snapshot with vote counts

  /messages/{id}/vote:
    post:
      summary: Cast a vote on a poll message
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionIndex]
              properties:
                optionIndex:
                  type: integer
      responses:
        "200":
          description: Updated poll; broadcasts poll_updated on WS

  /messages/{id}/translate:
    post:
      summary: Translate message text to target language (cached in D1)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetLang]
              properties:
                targetLang:
                  type: string
                sourceLang:
                  type: string
