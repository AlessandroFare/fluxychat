        "404":
          description: Message not found
    delete:
      summary: Remove reaction
      description: Remove an emoji reaction from a message.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
      responses:
        "200":
          description: Reaction removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  reaction:
                    $ref: "#/components/schemas/Reaction"
        "404":
          description: Message not found

  /rooms/{id}/read:
    post:
      summary: Mark room read
      description: Record a read receipt up to a given message in a room.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
                messageId:
                  type: integer
      responses:
        "200":
          description: Read receipt stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /reports:
    post:
      summary: Report message
      description: Create a moderation report for a specific message.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId, roomId]
              properties:
                messageId:
                  type: integer
                roomId:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Report accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Unauthorized

  /api/messages:
    get:
      summary: List messages
      description: Cursor-based history for a room. Requires member JWT with access to the room.
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: query
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: false
          description: Return messages created before this ISO timestamp.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"

  /rooms:
    get:
      summary: List rooms
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [dm, group, public]
        - name: userId
          in: query
          required: false
          description: If provided, includes `unreadCount` per room.
          schema:
            type: string
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        name:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        unreadCount:
                          type: integer
                          nullable: true
    post:
      summary: Create room
      description: Create a room (type dm/group/public); currently keyed by project API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  enum: [dm, group, public]
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                      role:
                        type: string
                        default: member
      responses:
        "200":
          description: Created room
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      name:
                        type: string
                      created_at:
                        type: string
                        format: date-time

  /rooms/dm:
    post:
      summary: Ensure DM room
      description: Returns an existing DM room for the pair or creates one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a, b]
