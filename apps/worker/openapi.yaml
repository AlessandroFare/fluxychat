    post:
      summary: Verify HMAC signature for a payload
      description: Uses stored `secret_hash` for the webhook; optional `secret` for raw verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhookId, signature, payload]
              properties:
                webhookId:
                  type: string
                signature:
                  type: string
                payload:
                  type: string
                secret:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean

  /webhooks/verify-batch:
    post:
      summary: Verify webhook batch HMAC (Pusher-compatible)
      description: |
        Verifies `X-Fluxy-Signature` or `X-Pusher-Signature` over a raw body string, or over
        `JSON.stringify(events)` for batched deliveries (max 50 events). Provide `secret` in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret:
                  type: string
                body:
                  type: string
                  description: Raw request body used for signing
                signature:
                  type: string
                events:
                  type: array
                  maxItems: 50
                  items: {}
                batchSignature:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  mode:
                    type: string
                    enum: [raw_body, batch]
                  batchSignatureValid:
                    type: boolean
                  results:
                    type: array
                    items:
                      type: object
        "400":
          description: Missing events or body+signature

