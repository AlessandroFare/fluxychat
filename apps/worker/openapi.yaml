  /iot/devices/{deviceId}/rpc:
    get:
      summary: Pull the oldest pending RPC (device key or member JWT)
      description: Accepts a member JWT or the device key for this device. Returns rpc null when the queue is empty.
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending RPC or null
    post:
      summary: Queue an RPC for a device (member only)
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
              properties:
                method:
                  type: string
                params:
                  type: object
      responses:
        "201":
          description: Queued RPC (status pending, persisted in D1)
        "400":
          description: method_required
        "403":
          description: Device keys cannot queue RPC
        "404":
          description: Unknown device
  /iot/devices/{deviceId}/rpc/persistent:
    get:
      summary: List the device RPC queue with status and results
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persistent RPCs (pending or replied)
  /iot/devices/{deviceId}/rpc/{rpcId}:
    post:
      summary: Reply to an RPC (device key or member JWT)
      description: Marks the RPC replied and stores the result. Accepts a member JWT or the device key for this device.
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
        - name: rpcId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result: {}
      responses:
        "200":
          description: RPC replied
        "400":
          description: Invalid request
        "404":
          description: Unknown or already-replied RPC
    delete:
      summary: Delete a queued or replied RPC
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
        - name: rpcId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: Unknown RPC
  /iot/rules:
    get:
      summary: List threshold rules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rules with condition and action, newest first
    post:
      summary: Create a threshold rule
      description: When a reading matches the condition, the rule raises an alarm on /iot/alarms. The action field is stored as declarative metadata and is not executed by the Worker.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - condition
                - action
              properties:
                name:
                  type: string
                deviceId:
                  type: string
                fleetId:
                  type: string
                condition:
                  type: object
                  properties:
                    sensor:
                      type: string
                    operator:
                      type: string
                      enum:
                        - ">"
                        - "<"
                        - ">="
                        - "<="
                        - "=="
                        - "!="
                    value:
                      type: number
                action:
                  type: object
                  description: Declarative metadata (for example a chat_message intent); not executed today
      responses:
        "200":
          description: Created rule
        "400":
          description: invalid_rule
  /iot/alarms:
    get:
      summary: List alarms (optionally by device)
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Alarms with severity, status, message and assignment
  /iot/alarms/{alarmId}/ack:
    post:
      summary: Acknowledge an active alarm
      security:
        - bearerAuth: []
      parameters:
        - name: alarmId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Alarm acked
        "404":
          description: Unknown alarm or not active
  /iot/alarms/{alarmId}/clear:
    post:
      summary: Clear an active or acked alarm
      security:
        - bearerAuth: []
      parameters:
        - name: alarmId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Alarm cleared
        "404":
          description: Unknown alarm or already cleared
  /iot/alarms/{alarmId}/assign:
    post:
      summary: Assign an alarm to a member
      security:
        - bearerAuth: []
      parameters:
        - name: alarmId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assigneeId
              properties:
                assigneeId:
                  type: string
      responses:
        "200":
          description: Assigned
        "400":
          description: assigneeId_required
        "404":
          description: Unknown alarm
    delete:
      summary: Unassign an alarm
      security:
        - bearerAuth: []
      parameters:
        - name: alarmId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unassigned
        "404":
          description: Unknown alarm
  /rooms/{roomId}/iot/events:
    post:
      summary: Ingest a device event as a room message (kind iot)
      description: Requires room access. The event is persisted as a message, fanned out, and can trigger ambient agents on the room.
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceId
              properties:
                deviceId:
                  type: string
                eventType:
                  type: string
                  description: Defaults to telemetry (alias type)
                payload:
                  type: object
                  description: Event body (alias data)
                actorUserId:
                  type: string
                  description: Author of the message, defaults to iot:deviceId
      responses:
        "201":
          description: Message id, content and ambient agent summary
        "400":
          description: deviceId required or missing_fields
        "403":
          description: No access to the room
  /fleet/gps:
    post:
      summary: Ingest one GPS location or a batch (vehicle key or member JWT)
      description: "Accepts a member JWT, or a vehicle key (`fleet_…`) for this vehicle only (Authorization: Bearer or X-Device-Key) — a vehicle key works on this route exclusively and the Worker forces the key's own vehicleId. OwnTracks location JSON (`_type: location`) is accepted, arrays too; other `_type` values are skipped. Fans out `fleet.gps_update` on the room (default `fleet:{projectId}`)."
      security:
        - bearerAuth: []
      parameters:
        - name: X-Limit-User
          in: header
          schema:
            type: string
          description: OwnTracks limit user (becomes vehicleId as user:device when the body has none)
        - name: X-Limit-Device
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lat
              properties:
                vehicleId:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                  description: lon alias accepted
                _type:
                  type: string
                  description: OwnTracks type; only location is ingested
                tst:
                  type: number
                  description: unix seconds or ms
                tid:
                  type: string
                speed:
                  type: number
                  description: vel alias accepted
                heading:
                  type: number
                  description: cog alias accepted
                accuracy:
                  type: number
                  description: acc alias accepted
                batt:
                  type: number
                roomId:
                  type: string
                  description: Fan-out room (default fleet:projectId)
      responses:
        "200":
          description: Ingest result (batch returns ok, count, results); geofenceEvents carries enter/exit transitions
        "400":
          description: Parse error or no_location when every item was skipped
        "429":
          description: quota_exceeded (60 points per vehicle per minute) with retryAfterSeconds
  /fleet/gps/current:
    get:
      summary: Current positions of online vehicles (offline after 10 minutes)
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: query
          schema:
            type: string
          description: device alias accepted
      responses:
        "200":
          description: Online vehicles with lat/lng/heading/speed/lastSeenAt
  /fleet/gps/last:
    get:
      summary: Alias of /fleet/gps/current (recorder "last")
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: query
          schema:
            type: string
        - name: device
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Online vehicles with lat/lng/heading/speed/lastSeenAt
  /fleet/gps/history:
    get:
      summary: GPS history for a vehicle (newest first, reversed to chronological)
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
          description: unix ms, unix seconds or ISO date (default now - 1h)
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
          description: Cap 10000
        - name: X-Limit-From
          in: header
          schema:
            type: string
          description: Recorder header fallback for from
        - name: X-Limit-To
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Points with ts/lat/lng/speed/heading
        "400":
          description: vehicleId query param required
  /fleet/gps/locations:
    get:
      summary: Alias of /fleet/gps/history (recorder "locations")
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Points with ts/lat/lng/speed/heading
        "400":
          description: vehicleId query param required
  /fleet/vehicles:
    get:
      summary: List vehicles with last position and status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vehicles for the project, sorted by name
    post:
      summary: Create a vehicle (returns a one-time apiKey)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                plate:
                  type: string
                driverId:
                  type: string
      responses:
        "201":
          description: Vehicle plus apiKey (fleet_..., shown once - the device then ingests with it)
        "400":
          description: name required (max 100 chars)
  /fleet/vehicles/{vehicleId}:
    patch:
      summary: Update vehicle fields (name, plate, driverId, status)
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                plate:
                  type: string
                driverId:
                  type: string
                status:
                  type: string
      responses:
        "200":
          description: Updated
        "400":
          description: body required or no fields to update
  /fleet/trips:
    get:
      summary: List trips (optionally by status), newest first, cap 100
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - active
              - completed
              - cancelled
      responses:
        "200":
          description: Trips with pickup/dropoff and distance
    post:
      summary: Create a trip (pending; distance computed with haversine)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicleId
                - pickupLat
                - pickupLng
                - dropoffLat
                - dropoffLng
              properties:
                vehicleId:
                  type: string
                pickupLat:
                  type: number
                pickupLng:
                  type: number
                dropoffLat:
                  type: number
                dropoffLng:
                  type: number
                pickupAddress:
                  type: string
                dropoffAddress:
                  type: string
      responses:
        "201":
          description: Created trip (status pending, distanceMeters)
        "400":
          description: Parse error (vehicleId or coordinates)
  /fleet/trips/{tripId}:
    patch:
      summary: Advance a trip (pending to active/cancelled, active to completed/cancelled)
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - completed
                    - cancelled
      responses:
        "200":
          description: Updated (starting completes timestamps and sets the vehicle idle)
        "400":
          description: Valid status required or invalid transition
        "404":
          description: trip_not_found
  /fleet/geofences:
    get:
      summary: List geofences (circle fences, meters radius)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Geofences sorted by name
    post:
      summary: Create a geofence (default radius 100 m)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - lat
                - lng
              properties:
                name:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                radiusMeters:
                  type: number
      responses:
        "201":
          description: Created geofence
        "400":
          description: Parse error (name or lat/lng)
  /fleet/geofences/{geofenceId}:
    patch:
      summary: Patch a geofence (name, lat, lng, radiusMeters)
      security:
        - bearerAuth: []
      parameters:
        - name: geofenceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                radiusMeters:
                  type: number
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid field or no fields to update
        "404":
          description: geofence_not_found
    delete:
      summary: Delete a geofence
      security:
        - bearerAuth: []
      parameters:
        - name: geofenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "404":
          description: geofence_not_found
  /fleet/geofence-events:
    get:
      summary: Stored enter/exit transitions, newest first, cap 500
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: query
          schema:
            type: string
        - name: geofenceId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: geofenceId, vehicleId, eventType (enter/exit), occurredAt
  /fleet/delivery/nearest:
    post:
      summary: Nearest available drivers to a point (online or idle)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: number
                lng:
                  type: number
                limit:
                  type: integer
                  description: Default 5
      responses:
        "200":
          description: Drivers with haversine distanceMeters, nearest first
        "400":
          description: lat/lng required
  /fleet/delivery/match:
    post:
      summary: Match a delivery to the nearest driver and create the trip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickupLat
                - pickupLng
                - dropoffLat
                - dropoffLng
              properties:
                pickupLat:
                  type: number
                pickupLng:
                  type: number
                dropoffLat:
                  type: number
                dropoffLng:
                  type: number
                pickupAddress:
                  type: string
                dropoffAddress:
                  type: string
      responses:
        "201":
          description: Trip plus driver with a heuristic etaMinutes (distance over ~30 km/h)
        "400":
          description: Coordinate parse error
        "404":
          description: no_available_drivers
  /fleet/route/copilot:
    post:
      summary: Route options with an hour-of-day heuristic (not live traffic)
      description: Deterministic heuristic - distance (haversine), an hourly traffic table and randomised weather, not a live traffic or maps provider.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickupLat
                - pickupLng
                - dropoffLat
                - dropoffLng
              properties:
                pickupLat:
                  type: number
                pickupLng:
                  type: number
                dropoffLat:
                  type: number
                dropoffLng:
                  type: number
      responses:
        "200":
          description: Copilot plan - estimatedDurationMin, three alternatives and advice
        "400":
          description: pickup/dropoff lat/lng required
  /fleet/delivery/predict:
    post:
      summary: Predicted delivery window from past trips (heuristic)
      description: Heuristic window - distance over an average speed, peak-hour factor and confidence derived from the project's completed trips, not an ML model.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickupLat
                - pickupLng
                - dropoffLat
                - dropoffLng
              properties:
                pickupLat:
                  type: number
                pickupLng:
                  type: number
                dropoffLat:
                  type: number
                dropoffLng:
                  type: number
      responses:
        "200":
          description: "Window - windowLow/Minutes, windowHigh/Minutes, confidencePercent, sampleSize"
        "400":
          description: pickup/dropoff lat/lng required
  /fleet/pricing:
    post:
      summary: Dynamic pricing suggestion from the live demand ratio (heuristic)
      description: Heuristic - active trips over available drivers drives the surge multiplier; the base price is demo-grade.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Pricing - basePrice, surgeMultiplier, surgePrice, surgeLabel, activeTrips, availableDrivers, demandRatio"
  /api/live/events:
    post:
      summary: Create a live event
      description: "`title` required; optional roomId, description, streamUrl, thumbnailUrl, category, tags. Returns { event }."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                roomId:
                  type: string
                description:
                  type: string
                streamUrl:
                  type: string
                thumbnailUrl:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Created event
        "400":
          description: title required
        "500":
          description: storage failure, message in body
    get:
      summary: List live events (newest first)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Filter scheduled | live | ended
        - name: limit
          in: query
          schema:
            type: integer
          description: Default 25
      responses:
        "200":
          description: "List - { events }"
  /api/live/events/{eventId}:
    get:
      summary: One live event (with stream keys once provisioned)
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The event
        "404":
          description: not_found
    patch:
      summary: Partial update (title, description, status, streamUrl, thumbnailUrl, category, tags)
      description: Returns an update ack; send status live to go live.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Update result - { updated }"
  /api/live/events/{eventId}/provision:
    post:
      summary: Provision a Cloudflare Stream live input (WHIP/RTMPS ingest, HLS/DASH playback)
      description: "Stores uid/rtmps_url/stream_key/whip_url/playback on the event and returns it. Idempotent once liveInputUid is set. 503 cloudflare_stream_not_configured when the Worker has no Cloudflare Stream secrets. Provider is the integrator's; bring your own Cloudflare account."
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The provisioned event
        "404":
          description: not_found
        "502":
          description: Upstream provider failure
        "503":
          description: cloudflare_stream_not_configured
  /api/live/events/{eventId}/input:
    delete:
      summary: Delete the Cloudflare Stream live input and clear stored stream keys
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Deletion ack - { deleted }"
        "404":
          description: not_found
  /api/live/events/{eventId}/rules:
    post:
      summary: Upsert chat rules (slow mode, emote-only, follower/subscriber gates, link protection)
      description: Creates on first call, updates afterwards; returns the id plus created or updated.
