            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
        "401":
          description: Unauthorized
        "402":
          description: Agent-invoke quota exceeded (listing consumes quota in current worker)
    post:
      summary: Create or update an agent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                handle:
                  type: string
                provider:
                  type: string
                model:
                  type: string
                systemPrompt:
                  type: string
                webhookUrl:
                  type: string
                capabilities:
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                config:
                  type: object
      responses:
        "200":
          description: Created agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: object
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get agent by id
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: object
        "404":
          description: Not found
    patch:
      summary: Update agent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: object
        "404":
          description: Not found
    delete:
      summary: Delete agent
      description: Requires owner or admin role.
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: Forbidden
        "404":
          description: Not found

  /agents/{agentId}/copilot:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: 1:1 copilot session state on the Agent Durable Object
      description: Turns live on AgentDurableObject, not on the multi-user Room DO.
      security:
