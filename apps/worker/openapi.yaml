          application/json:
            schema:
              type: object
              required: [roomId, userId]
              properties:
                roomId:
                  type: string
                userId:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Unmuted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /admin/unban:
    post:
      summary: Unban user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, userId]
              properties:
                roomId:
                  type: string
                userId:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Unbanned
