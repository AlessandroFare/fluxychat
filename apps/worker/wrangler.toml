name = "fluxychat-worker"
main = "src/worker.js"
# Browser Run quickAction() requires 2026-03-24+
compatibility_date = "2026-03-24"

[vars]
# When true, cron jobs run via FluxyScheduledWorkflow (P12-L); Worker `scheduled` is a no-op.
WORKFLOW_SCHEDULES_ENABLED = "false"
# Browser Run quickAction() incurs cost — set "true" only when you need SPA OG previews.
BROWSER_ENABLED = "false"

# Local optional vars/secrets: see `.dev.vars.example` (copy to `.dev.vars` for `wrangler dev`).
# Runtime env/secrets checklist:
# - AI: Cloudflare AI Gateway (P12-I) preferred — AI_GATEWAY_ACCOUNT_ID + AI_GATEWAY_ID + AI_GATEWAY_TOKEN
#   (+ AI_GATEWAY_PROVIDER_KEY or AI_API_KEY for upstream). Legacy fallback: AI_BASE_URL + AI_API_KEY.
# - Optional automatic AI room summaries (requires AI configured via gateway or AI_BASE_URL):
#   AUTO_ROOM_SUMMARY_ENABLED=true
#   AUTO_ROOM_SUMMARY_EVERY_N=50   # fire when message count is a multiple of N (per room)
#   AUTO_ROOM_SUMMARY_COOLDOWN_MINUTES=120   # skip if a manual or auto summary ran recently
# - P12-F daily AI digest (requires migration 0051 + AI_BASE_URL):
#   DAILY_DIGEST_ENABLED=true
#   DIGEST_EMAIL_FROM=digest@yourdomain.com   # optional; or RESEND_API_KEY / EMAIL binding
# - P13-T1 inbound SMS/WhatsApp → room (requires migration 0054):
#   TELCO_INBOUND_ENABLED=true
#   TELCO_INBOUND_DEFAULT_ROOM_ID=support   # fallback when no delivery/DM mapping
# - Optional built-in substring moderation (webhook event moderation.auto_flag):
#   BUILTIN_MODERATION_ENABLED=true
#   BUILTIN_MODERATION_BLOCKED_SUBSTRINGS=badword1,badword2
# - Optional at-rest encryption for webhook secrets (base64-encoded 32 bytes key):
#   WEBHOOK_SECRET_ENCRYPTION_KEY=...base64(32bytes)...
# - REQUIRE_ADMIN_AUTH=true
# - HOSTED_MULTI_TENANT=true + FLUXY_PLATFORM_PROJECT_ID (from pnpm provision:bootstrap)
# - PLATFORM_BOOTSTRAP_SECRET (one-time; POST /platform/bootstrap)
# - QUOTAS_ENABLED=true
# - DEFAULT_PRICING_VERSION=v1
# - QUOTA_MESSAGES_PER_MONTH / QUOTA_AGENT_INVOKES_PER_MONTH / QUOTA_WEBHOOK_DELIVERIES_PER_MONTH
# - ALLOWED_ORIGINS=https://yourdomain.com,https://app.yourdomain.com
# - tenant JWT secrets stored in D1 project_secrets

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "USER"
class_name = "UserDurableObject"

# Optional per-IP WS connect rate limit (one DO per IP scope). Falls back to RATE_LIMIT_KV when unset.
[[durable_objects.bindings]]
name = "IP_RATE_LIMITER"
class_name = "IpRateLimiterDurableObject"

[[d1_databases]]
binding = "DB"
database_name = "fluxychat"
database_id = "2393de6c-4c38-4e1e-afbb-2f26e64e6904"
migrations_dir = "db"

# KV namespace used for distributed rate limiting.
# IMPORTANT: Create KV namespace and update IDs before production deploy:
#   npx wrangler kv namespace create RATE_LIMIT_KV
#   npx wrangler kv namespace create RATE_LIMIT_KV --preview
# Then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "02d35b13ac6640c58fcd66166ea0214c"   # npx wrangler kv namespace create RATE_LIMIT_KV → paste id here
preview_id = "536bdaedd5ce4e28b898e4bfb65ef3a2"   # npx wrangler kv namespace create RATE_LIMIT_KV --preview → paste id here

# R2 bucket for file attachments and media storage.
# Create with: wrangler r2 bucket create fluxychat-attachments
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "fluxychat-attachments"

# Free Workers plan requires SQLite-backed DO (new_sqlite_classes, not new_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["IpRateLimiterDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["UserDurableObject"]

# P12-L: scheduled jobs via Workflows (set WORKFLOW_SCHEDULES_ENABLED=false + uncomment triggers for legacy cron)
[triggers]
crons = ["0 3 * * *", "0 8 * * *", "*/15 * * * *", "*/5 * * * *"]

[browser]
binding = "BROWSER"

# P12-J: Flagship feature flags — set app_id from Cloudflare dashboard (Compute > Flagship)
# [[flagship]]
# binding = "FLAGS"
# app_id = "<FLAGSHIP_APP_ID>"

# [[workflows]]
# name = "fluxychat-scheduled"
# binding = "FLUXY_SCHEDULED_WORKFLOW"
# class_name = "FluxyScheduledWorkflow"
# schedules = ["0 3 * * *", "0 8 * * *", "*/15 * * * *", "*/5 * * * *"]

[[routes]]
pattern = "api.fluxychat.com"
custom_domain = true



